[package]
name = "safu"
version = "0.1.0"
edition = "2021"
description = "safu.fun rug-cover contract: policies, USDC pool, rug lifecycle, payouts via Intents + Chain Signatures"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.30.2", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "5.30.2", features = ["unit-testing", "unstable"] }
